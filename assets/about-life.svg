<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
<title id="title">What Daksh explores</title><desc id="desc">An overview of Daksh Vasani's interests across data analysis, machine learning, visualization and AI application development.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1020"/><stop offset="1" stop-color="#171b34"/></linearGradient><linearGradient id="a" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#54e8ff"/><stop offset="1" stop-color="#818dff"/></linearGradient><linearGradient id="b" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#bc94ff"/><stop offset="1" stop-color="#ff9ac8"/></linearGradient><pattern id="g" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#90a7e8" stroke-opacity=".06"/></pattern></defs>
<style>.eyebrow{font:600 12px 'Segoe UI',Arial,sans-serif;letter-spacing:2px;fill:#9eafd4}.heading{font:700 31px 'Segoe UI',Arial,sans-serif;fill:#f3f7ff}.cardtitle{font:700 19px 'Segoe UI',Arial,sans-serif;fill:#eef5ff}.copy{font:400 14px 'Segoe UI',Arial,sans-serif;fill:#aebcda}.small{font:600 11px 'Segoe UI',Arial,sans-serif;letter-spacing:1.2px;fill:#c3d5f7}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}.card{animation:bob 7s ease-in-out infinite}.card:nth-of-type(2){animation-delay:.8s}.card:nth-of-type(3){animation-delay:1.3s}.card:nth-of-type(4){animation-delay:1.8s}@media(prefers-reduced-motion:reduce){.card{animation:none}}</style>
<rect width="1200" height="650" rx="26" fill="url(#bg)"/><rect width="1200" height="650" rx="26" fill="url(#g)"/><circle cx="1030" cy="90" r="210" fill="#6d5fff" opacity=".09"/>
<text x="62" y="73" class="eyebrow">A LITTLE ABOUT MY WAY OF THINKING</text><text x="62" y="119" class="heading">Curiosity in. Useful insights out.</text><text x="64" y="151" class="copy">I like connecting analytical thinking with practical, user-focused software.</text>
<g class="card"><rect x="62" y="194" width="330" height="166" rx="19" fill="#111a30" stroke="#38577f"/><rect x="85" y="218" width="46" height="46" rx="14" fill="#18344c"/><path d="M97 250V238M108 250V230M119 250V222" stroke="#69eaff" stroke-width="4" stroke-linecap="round"/><text x="85" y="293" class="cardtitle">Analyze</text><text x="85" y="320" class="copy">Explore datasets, spot patterns,</text><text x="85" y="340" class="copy">and ask better questions.</text></g>
<g class="card"><rect x="411" y="194" width="330" height="166" rx="19" fill="#111a30" stroke="#38577f"/><rect x="434" y="218" width="46" height="46" rx="14" fill="#26284b"/><circle cx="457" cy="241" r="5" fill="#b99bff"/><circle cx="446" cy="230" r="3" fill="#b99bff"/><circle cx="469" cy="229" r="3" fill="#b99bff"/><circle cx="447" cy="253" r="3" fill="#b99bff"/><circle cx="469" cy="253" r="3" fill="#b99bff"/><path d="M449 232L454 238M460 238L467 231M454 244L449 251M461 244L467 251" stroke="#b99bff" stroke-width="1.5"/><text x="434" y="293" class="cardtitle">Model</text><text x="434" y="320" class="copy">Experiment with machine learning</text><text x="434" y="340" class="copy">to make useful predictions.</text></g>
<g class="card"><rect x="62" y="380" width="330" height="166" rx="19" fill="#111a30" stroke="#38577f"/><rect x="85" y="404" width="46" height="46" rx="14" fill="#153c3b"/><path d="M94 439V428H102V439M106 439V418H114V439M118 439V411H124V439" fill="none" stroke="#6bf2c5" stroke-width="3" stroke-linejoin="round"/><text x="85" y="479" class="cardtitle">Visualize</text><text x="85" y="506" class="copy">Turn findings into clear charts</text><text x="85" y="526" class="copy">and stories people can use.</text></g>
<g class="card"><rect x="411" y="380" width="330" height="166" rx="19" fill="#111a30" stroke="#38577f"/><rect x="434" y="404" width="46" height="46" rx="14" fill="#3a2948"/><path d="M444 428L450 434 463 419M457 409H468V420" fill="none" stroke="#ffa2d0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="434" y="479" class="cardtitle">Build</text><text x="434" y="506" class="copy">Create Python and AI tools</text><text x="434" y="526" class="copy">that solve practical problems.</text></g>
<g><rect x="776" y="194" width="361" height="352" rx="22" fill="#0e172b" stroke="#536aa0" stroke-opacity=".75"/><text x="805" y="229" class="eyebrow">MY WORKFLOW</text><path d="M824 271V463" stroke="#405a84" stroke-width="2" stroke-dasharray="4 7"/><g><circle cx="824" cy="278" r="13" fill="#183b54" stroke="#5fe7ff"/><text x="824" y="282" text-anchor="middle" font-family="Arial" font-size="11" fill="#effcff">1</text><text x="852" y="275" class="cardtitle" font-size="16">Understand</text><text x="852" y="296" class="copy">Clarify the problem and the data.</text></g><g><circle cx="824" cy="342" r="13" fill="#27294e" stroke="#a99bff"/><text x="824" y="346" text-anchor="middle" font-family="Arial" font-size="11" fill="#f8f1ff">2</text><text x="852" y="339" class="cardtitle" font-size="16">Experiment</text><text x="852" y="360" class="copy">Try methods, evaluate, iterate.</text></g><g><circle cx="824" cy="406" r="13" fill="#203d3a" stroke="#74efc7"/><text x="824" y="410" text-anchor="middle" font-family="Arial" font-size="11" fill="#effff9">3</text><text x="852" y="403" class="cardtitle" font-size="16">Communicate</text><text x="852" y="424" class="copy">Explain results in a simple way.</text></g><rect x="805" y="466" width="303" height="51" rx="12" fill="#15233d" stroke="#3e5d91"/><text x="826" y="487" class="small">CURRENT BASE</text><text x="826" y="505" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="600" fill="#f0f6ff">M.Sc. Data Science · Silver Oak University</text></g>
<text x="1134" y="610" text-anchor="end" class="eyebrow">LEARN BY BUILDING</text></svg>
