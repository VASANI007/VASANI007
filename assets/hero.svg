<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
<title id="title">Daksh Vasani — Data Science profile</title>
<desc id="desc">A futuristic midnight-blue profile banner for Daksh Vasani, M.Sc. Data Science student, exploring machine learning, analytics and Python.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#080d1b"/><stop offset=".55" stop-color="#10152b"/><stop offset="1" stop-color="#171b38"/></linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#58e7ff"/><stop offset=".52" stop-color="#6c9bff"/><stop offset="1" stop-color="#bc8cff"/></linearGradient>
  <linearGradient id="sphere" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#59e5ff" stop-opacity=".85"/><stop offset=".5" stop-color="#527bff" stop-opacity=".65"/><stop offset="1" stop-color="#b168ff" stop-opacity=".72"/></linearGradient>
  <radialGradient id="glow"><stop stop-color="#347cff" stop-opacity=".36"/><stop offset="1" stop-color="#347cff" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#8aa4ff" stroke-opacity=".09" stroke-width="1"/></pattern>
  <filter id="blur"><feGaussianBlur stdDeviation="22"/></filter>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#02040b" flood-opacity=".42"/></filter>
</defs>
<style>
  .label{font:600 12px 'Segoe UI',Arial,sans-serif;letter-spacing:2.2px;fill:#9baad0}.body{font:400 17px 'Segoe UI',Arial,sans-serif;fill:#b9c5df}.chip{font:600 12px 'Segoe UI',Arial,sans-serif;letter-spacing:1px;fill:#e8f3ff}.micro{font:600 10px 'Segoe UI',Arial,sans-serif;letter-spacing:1.7px;fill:#9bb0d8}
  @keyframes drift{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}} @keyframes pulse{0%,100%{opacity:.45}50%{opacity:.95}} @keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
  .float{animation:drift 6s ease-in-out infinite}.pulse{animation:pulse 3.5s ease-in-out infinite}.orbit{transform-origin:930px 330px;animation:spin 42s linear infinite}
  @media (prefers-reduced-motion:reduce){.float,.pulse,.orbit{animation:none}}
</style>
<rect width="1200" height="640" rx="28" fill="url(#bg)"/><rect width="1200" height="640" rx="28" fill="url(#grid)"/>
<circle cx="1000" cy="300" r="300" fill="url(#glow)"/><circle cx="1130" cy="70" r="130" fill="#a06dff" opacity=".08" filter="url(#blur)"/>
<path d="M0 490C170 450 260 575 430 540S700 480 830 560 1080 590 1200 520V640H0Z" fill="#25305a" opacity=".18"/>
<rect x="62" y="44" width="254" height="34" rx="17" fill="#111d36" stroke="#5478bc" stroke-opacity=".6"/><circle cx="81" cy="61" r="4" fill="#59e5ff"/><text x="96" y="65" class="label" fill="#d8e8ff">DATA SCIENCE · BUILDER LOG</text>
<text x="65" y="190" font-family="Segoe UI,Arial,sans-serif" font-size="76" font-weight="800" letter-spacing="-2" fill="#f5f7ff">DAKSH</text>
<text x="65" y="270" font-family="Segoe UI,Arial,sans-serif" font-size="76" font-weight="800" letter-spacing="-2" fill="url(#accent)">VASANI</text>
<text x="70" y="316" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="2" fill="#dce8ff">M.Sc. DATA SCIENCE STUDENT</text>
<text x="70" y="359" class="body">Turning raw data into useful insights.</text><text x="70" y="386" class="body">Learning, experimenting, and building AI-powered tools.</text>
<g transform="translate(68 430)"><rect width="128" height="37" rx="18.5" fill="#13233c" stroke="#3d668f"/><text x="64" y="23" text-anchor="middle" class="chip">PYTHON</text><rect x="139" width="178" height="37" rx="18.5" fill="#13233c" stroke="#3d668f"/><text x="228" y="23" text-anchor="middle" class="chip">MACHINE LEARNING</text><rect x="328" width="132" height="37" rx="18.5" fill="#13233c" stroke="#3d668f"/><text x="394" y="23" text-anchor="middle" class="chip">ANALYTICS</text></g>
<text x="70" y="555" class="micro">EXPLORE · ANALYZE · BUILD · IMPROVE</text>
<!-- Data-orbit illustration -->
<g class="float">
  <circle cx="929" cy="328" r="160" fill="#243e7b" opacity=".16"/><circle cx="929" cy="328" r="127" fill="none" stroke="#80dfff" stroke-opacity=".36" stroke-width="1.4"/><circle cx="929" cy="328" r="96" fill="none" stroke="#7a9cff" stroke-opacity=".3" stroke-width="1" stroke-dasharray="4 8"/>
  <circle cx="929" cy="328" r="76" fill="url(#sphere)" opacity=".18" stroke="#9cecff" stroke-opacity=".85" stroke-width="1.4"/>
  <ellipse cx="929" cy="328" rx="76" ry="29" fill="none" stroke="#c4e5ff" stroke-opacity=".75"/><ellipse cx="929" cy="328" rx="31" ry="76" fill="none" stroke="#c4e5ff" stroke-opacity=".55"/><path d="M855 328H1003M929 252V404" stroke="#c4e5ff" stroke-opacity=".3"/>
  <circle cx="929" cy="328" r="12" fill="#d9fbff"/><circle cx="929" cy="328" r="23" fill="none" stroke="#7be9ff" stroke-opacity=".65"/>
</g>
<g class="orbit"><ellipse cx="929" cy="328" rx="190" ry="70" transform="rotate(-28 929 328)" fill="none" stroke="url(#accent)" stroke-width="1.8" stroke-opacity=".8"/><circle cx="1098" cy="251" r="7" fill="#63eaff"/><circle cx="760" cy="404" r="5" fill="#b38cff"/></g>
<g filter="url(#shadow)"><rect x="786" y="116" width="210" height="75" rx="15" fill="#0c1428" stroke="#506b9d" stroke-opacity=".8"/><text x="806" y="141" class="micro">MODEL PIPELINE</text><text x="806" y="166" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="600" fill="#e9f5ff">DATA → PATTERN</text><path d="M969 155l7 6 11-14" fill="none" stroke="#60edc1" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></g>
<g filter="url(#shadow)"><rect x="970" y="420" width="164" height="86" rx="15" fill="#0c1428" stroke="#506b9d" stroke-opacity=".8"/><text x="989" y="445" class="micro">INSIGHT</text><path d="M990 482L1011 469 1028 475 1045 451 1064 459 1099 438" fill="none" stroke="url(#accent)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="1099" cy="438" r="4" fill="#65eaff"/></g>
<g class="pulse"><circle cx="1090" cy="147" r="3" fill="#ebc8ff"/><circle cx="773" cy="287" r="3" fill="#72e9ff"/><circle cx="1046" cy="365" r="4" fill="#7c9cff"/></g>
<text x="1116" y="604" text-anchor="end" class="micro">VASANI007</text>
</svg>
